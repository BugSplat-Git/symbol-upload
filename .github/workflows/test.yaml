name: Unit Tests
permissions:
  contents: read

on:
  pull_request:
    branches: [main]

jobs:
  test:
    # spec/bin.spec.ts spawns the real CLI, so this matrix is what covers the teardown path on the
    # platform that reproduces #201 — a libuv assertion in src\win\async.c that loses the exit code.
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: ☑️ Checkout
        uses: actions/checkout@v6

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: 🏗️ Install Dependencies
        run: npm ci

      - name: 🧪 Run Tests
        run: npm test
