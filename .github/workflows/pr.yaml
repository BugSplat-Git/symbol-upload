name: Test GitHub Action

on:
  pull_request:
    branches: [ main ]

jobs:
  test-my-action:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - name: ☑️ Checkout
      uses: actions/checkout@v6

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: 🛠️ Pack Local Build
      shell: bash
      run: |
        npm ci
        npm run build
        npm pack
        mv bugsplat-symbol-upload-*.tgz symbol-upload.tgz

    - name: 📦 Symbols
      uses: ./
      with:
        clientId: ${{ secrets.SYMBOL_UPLOAD_CLIENT_ID }}
        clientSecret: ${{ secrets.SYMBOL_UPLOAD_CLIENT_SECRET }}
        database: ${{ secrets.BUGSPLAT_DATABASE }}
        application: "symbol-upload-test"
        version: "1.0"
        directory: "spec/support"
        files: "**/*.sym"
        node-version: '24'
        symbol-upload-version: "file:./symbol-upload.tgz"
