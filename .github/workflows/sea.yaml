name: Single Executable Application

on:
    push:
        tags:
        - 'v[0-9]+.[0-9]+.[0-9]+*'


jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, macos-latest-large, windows-latest]
        include:
          - os: ubuntu-latest
            run_script: sea:linux
            artifact_name: symbol-upload-linux
            file_name: symbol-upload-linux
          - os: macos-latest
            run_script: sea:macos
            artifact_name: symbol-upload-macos
            file_name: symbol-upload-macos
          - os: macos-latest-large
            run_script: sea:macos
            artifact_name: symbol-upload-macos-intel
            file_name: symbol-upload-macos
          - os: windows-latest
            run_script: sea:windows
            artifact_name: symbol-upload-windows.exe
            file_name: symbol-upload-windows.exe
    
    steps:
    - name: ☑️ Checkout
      uses: actions/checkout@v6

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: 🏗️ Install Dependencies
      run: npm ci

    - name: 📦 Run Pkg
      run: npm run ${{ matrix.run_script }} # Executes the script based on the operating system

    - name: ⬆️ Upload Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact_name }}
        path: dist/${{ matrix.file_name }} # Uploads the artifact with a platform-specific name and path

  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - name: ☑️ Checkout
      uses: actions/checkout@v6

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: 🏗️ Install Dependencies
      run: npm ci

    - name: 📦 Build
      run: npm run build

    - name: 🔍 Smoke Test
      run: node ./dist/bin/index.js -h

    - name: 🚀 Publish to npm
      env:
        TAG: ${{ github.ref_name }}
      run: |
        VERSION=$(node -p "require('./package.json').version")
        if [ "v$VERSION" != "$TAG" ]; then
          echo "package.json version ($VERSION) does not match tag ($TAG)" >&2
          exit 1
        fi
        if npm view "@bugsplat/symbol-upload@$VERSION" version >/dev/null 2>&1; then
          echo "$VERSION already published, skipping"
          exit 0
        fi
        DIST_TAG=""
        case "$VERSION" in *-*) DIST_TAG="--tag next";; esac
        npm publish --access public $DIST_TAG

  release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
    - name: ⬇️ Download Artifacts
      uses: actions/download-artifact@v7
      with:
        path: artifacts

    - name: 📦 Stage Release Assets
      run: |
        mkdir release
        cp artifacts/symbol-upload-linux/symbol-upload-linux release/symbol-upload-linux
        cp artifacts/symbol-upload-macos/symbol-upload-macos release/symbol-upload-macos
        cp artifacts/symbol-upload-macos-intel/symbol-upload-macos release/symbol-upload-macos-intel
        cp artifacts/symbol-upload-windows.exe/symbol-upload-windows.exe release/symbol-upload-windows.exe
        chmod +x release/symbol-upload-linux release/symbol-upload-macos release/symbol-upload-macos-intel

    - name: 🚀 Create Release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        PRERELEASE=""
        if [[ "$TAG" == *-* ]]; then
          PRERELEASE="--prerelease"
        fi
        if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
        else
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes $PRERELEASE
        fi

    - name: 🏷️ Update Major Tag
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          MAJOR="${TAG%%.*}"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$MAJOR" --silent >/dev/null 2>&1; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$MAJOR" -X PATCH -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$MAJOR" -f sha="$GITHUB_SHA" >/dev/null
          fi
          echo "Moved $MAJOR to $GITHUB_SHA"
        fi
